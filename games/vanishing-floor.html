<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vanishing Floor | الأرضية المتلاشية</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; }
    body { overflow:hidden; background:#08050f; font-family:system-ui, sans-serif; }
    canvas { display:block; width:100vw; height:100vh; }
    .hud { position:absolute; top:20px; width:100%; display:flex; justify-content:space-between; padding:0 20px; z-index:5; pointer-events:none; }
    .box { background:rgba(20,18,10,0.9); border:1px solid rgba(212,175,55,0.4); padding:10px 16px; border-radius:12px; text-align:center; }
    .box small { display:block; font-size:10px; color:#a1a1a6; letter-spacing:1px; }
    .box b { font-size:20px; color:#d4af37; text-shadow:0 0 10px rgba(212,175,55,0.4); }
    .screen { position:absolute; inset:0; background:rgba(8,5,15,0.95); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:10; padding:30px; text-align:center; backdrop-filter:blur(10px); }
    .screen.hidden { display:none; }
    h1 { color:#d4af37; font-size:36px; margin-bottom:12px; text-shadow:0 0 25px rgba(212,175,55,0.4); }
    p { color:#a1a1a6; margin-bottom:28px; max-width:320px; line-height:1.7; }
    button { background:linear-gradient(135deg,#fcf6ba,#b38728); color:#0b0b0d; border:none; padding:16px 40px; font-size:18px; font-weight:900; border-radius:50px; cursor:pointer; box-shadow:0 0 25px rgba(212,175,55,0.4); }
</style>
<script src="../js/jamam-core.js"></script>
<script src="../js/jamam-progress.js"></script>
<script src="../js/jamam-achievements.js"></script>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
        <div class="box"><small>STEPS</small><b id="score">0</b></div>
        <div class="box"><small>BEST</small><b id="best">0</b></div>
    </div>

    <div id="start-screen" class="screen">
        <h1 id="t-title">Vanishing Floor</h1>
        <p id="t-desc">Don't stand still.<br>Move to a new tile before the one you're on vanishes.</p>
        <button id="t-btn" onclick="startGame()">Play</button>
    </div>
    <div id="over-screen" class="screen hidden">
        <h1 style="color:#ff287b">Collapsed!</h1>
        <p>Steps: <span id="final-score">0</span></p>
        <button onclick="startGame()">Retry</button>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const I18N = {
    en: { title:"Vanishing Floor", desc:"Don't stand still.<br>Move to a new tile before the one you're on vanishes.", play:"Play" },
    ar: { title:"الأرضية المتلاشية", desc:"لا تقف مكانك.<br>تحرك إلى بلاطة جديدة قبل أن تختفي التي تقف عليها.", play:"ابدأ" }
};
const L = (window.JAMAM && JAMAM.lang && I18N[JAMAM.lang()]) ? JAMAM.lang() : 'en';
document.getElementById('t-title').innerText = I18N[L].title;
document.getElementById('t-desc').innerHTML = I18N[L].desc;
document.getElementById('t-btn').innerText = I18N[L].play;

let w, h;
function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const COLS = 7, ROWS = 9;
let cellSize, offsetX, offsetY;
let grid, player, score, isPlaying, animId;
let best = parseInt(localStorage.getItem('vanishFloorBest') || '0');
document.getElementById('best').innerText = best;

// Swipe detection
let touchStartX = 0, touchStartY = 0;

function startGame() {
    cellSize = Math.min(w / (COLS + 2), h / (ROWS + 2));
    offsetX = (w - COLS * cellSize) / 2;
    offsetY = (h - ROWS * cellSize) / 2;

    grid = [];
    for(let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for(let c = 0; c < COLS; c++) grid[r][c] = { life: 1, active: true };
    }
    player = { r: Math.floor(ROWS/2), c: Math.floor(COLS/2) };
    grid[player.r][player.c].active = false; // Start tile doesn't decay
    score = 0;
    isPlaying = true;
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('over-screen').classList.add('hidden');
    if(window.JAMAM && JAMAM.game) JAMAM.game.start('vanishing-floor');
    if(!animId) animId = requestAnimationFrame(loop);
}

function move(dr, dc) {
    if(!isPlaying) return;
    const nr = player.r + dr, nc = player.c + dc;
    if(nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return;
    if(!grid[nr][nc].active) return;

    // Old tile begins to fade
    grid[player.r][player.c].active = false;
    grid[player.r][player.c].life = 1;

    player.r = nr; player.c = nc;
    grid[nr][nc].active = false; // New tile, starts fading when we leave
    score++;
    document.getElementById('score').innerText = score;
    if(window.JAMAM && JAMAM.haptics) JAMAM.haptics.tap('hit');
}

canvas.addEventListener('pointerdown', e => {
    touchStartX = e.clientX;
    touchStartY = e.clientY;
});
canvas.addEventListener('pointerup', e => {
    if(!isPlaying) return;
    const dx = e.clientX - touchStartX;
    const dy = e.clientY - touchStartY;
    if(Math.abs(dx) < 30 && Math.abs(dy) < 30) {
        // Tap - no move
        return;
    }
    if(Math.abs(dx) > Math.abs(dy)) {
        move(0, dx > 0 ? 1 : -1);
    } else {
        move(dy > 0 ? 1 : -1, 0);
    }
});

// Keyboard support
window.addEventListener('keydown', e => {
    if(e.key === 'ArrowUp') move(-1, 0);
    if(e.key === 'ArrowDown') move(1, 0);
    if(e.key === 'ArrowLeft') move(0, -1);
    if(e.key === 'ArrowRight') move(0, 1);
});

let lastTime = 0;
function loop(now) {
    if(!isPlaying) return;
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    animId = requestAnimationFrame(loop);

    ctx.fillStyle = '#08050f';
    ctx.fillRect(0, 0, w, h);

    // Update grid (tiles losing life)
    let stillActive = 0;
    for(let r = 0; r < ROWS; r++) {
        for(let c = 0; c < COLS; c++) {
            const tile = grid[r][c];
            if(!tile.active && tile.life > 0) {
                tile.life -= dt * 1.2; // ~0.8 seconds
                if(tile.life <= 0) tile.life = 0;
            }
            if(tile.life > 0 || tile.active) stillActive++;

            // Draw tile
            if(tile.life > 0 || (r === player.r && c === player.c)) {
                const x = offsetX + c * cellSize;
                const y = offsetY + r * cellSize;
                const inset = 3;

                if(r === player.r && c === player.c) {
                    // Player tile - bright gold
                    ctx.fillStyle = '#d4af37';
                    ctx.shadowBlur = 20; ctx.shadowColor = '#d4af37';
                } else {
                    // Fading tile - gold with alpha
                    const alpha = Math.max(0.15, tile.life);
                    ctx.fillStyle = `rgba(212,175,55,${alpha})`;
                    ctx.shadowBlur = 8 * tile.life;
                    ctx.shadowColor = '#d4af37';
                }
                ctx.fillRect(x + inset, y + inset, cellSize - inset*2, cellSize - inset*2);
                ctx.shadowBlur = 0;
            }
        }
    }

    // Draw player marker
    const px = offsetX + player.c * cellSize + cellSize/2;
    const py = offsetY + player.r * cellSize + cellSize/2;
    ctx.fillStyle = '#0b0b0d';
    ctx.beginPath(); ctx.arc(px, py, cellSize*0.25, 0, Math.PI*2); ctx.fill();

    // Check if player is stuck
    let canMove = false;
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc]) => {
        const nr = player.r + dr, nc = player.c + dc;
        if(nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].active) {
            canMove = true;
        }
    });
    // Also allow moving to tiles that still have life
    if(!canMove) {
        [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc]) => {
            const nr = player.r + dr, nc = player.c + dc;
            if(nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].life > 0.3) {
                canMove = true;
            }
        });
    }
    if(!canMove) gameOver();
}

function gameOver() {
    isPlaying = false;
    cancelAnimationFrame(animId);
    animId = null;
    if(score > best) { best = score; localStorage.setItem('vanishFloorBest', best); }
    document.getElementById('final-score').innerText = score;
    document.getElementById('best').innerText = best;
    document.getElementById('over-screen').classList.remove('hidden');
    if(window.JAMAM && JAMAM.game) JAMAM.game.end('vanishing-floor', { score: score });
}
</script>
</body>
</html>
