function draw(){g.clearRect(0,0,W,H);let ox=(W-cols*cell)/2,oy=(H-rows*cell)/2,now=performance.now()/1000;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let v=grid[y][x];if(v===-1)continue;let xx=ox+x*cell,yy=oy+y*cell,active=v===Infinity,remain=active?1:Math.max(0,Math.min(1,(v-now)/decay));g.fillStyle=active?'#d2ff4d':v>now?'rgba(255,59,212,'+(.1+remain*.4)+')':'#11152a';g.strokeStyle=active?'#d2ff4d':v>now?'#ff3bd4':'#41f5ff55';g.fillRect(xx+2,yy+2,cell-4,cell-4);g.strokeRect(xx+2,yy+2,cell-4,cell-4)}let xx=ox+px*cell+cell/2,yy=oy+py*cell+cell/2;g.fillStyle='#41f5ff';g.shadowBlur=18;g.shadowColor='#41f5ff';g.beginPath();g.arc(xx,yy,cell*.23,0,7);g.fill();g.shadowBlur=0}
function loop(now){let dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;if(alive){for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(grid[y][x]!==Infinity&&grid[y][x]>0&&grid[y][x]<now/1000)grid[y][x]=0;let v=grid[py][px];if(v!==Infinity&&v!==0&&v<now/1000){alive=false;best=Math.max(best,score);localStorage.vanishBest=best;$('best').textContent=best;$('msg').textContent=t('msgDead');triggerSubmit(score)}if(elapsed>12)decay=Math.max(.45,.8-(elapsed-12)*.01)}draw();requestAnimationFrame(loop)}
document.documentElement.lang=L;document.documentElement.dir=RTL.includes(L)?'rtl':'ltr';applyT();reset();loop(performance.now());
})();
