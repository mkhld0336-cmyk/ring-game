<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Echo Sonar | صدى الظلام</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; }
    body { overflow:hidden; background:#02030a; font-family:system-ui, sans-serif; }
    canvas { display:block; width:100vw; height:100vh; }
    .hud { position:absolute; top:20px; width:100%; display:flex; justify-content:space-between; padding:0 20px; z-index:5; pointer-events:none; }
    .box { background:rgba(10,14,28,0.9); border:1px solid rgba(212,175,55,0.4); padding:10px 16px; border-radius:12px; text-align:center; }
    .box small { display:block; font-size:10px; color:#a1a1a6; letter-spacing:1px; }
    .box b { font-size:20px; color:#d4af37; text-shadow:0 0 10px rgba(212,175,55,0.4); }
    .hint { position:absolute; bottom:20px; left:0; right:0; text-align:center; color:#a1a1a6; font-size:12px; padding:0 20px; z-index:5; }
    .screen { position:absolute; inset:0; background:rgba(2,3,10,0.95); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:10; padding:30px; text-align:center; backdrop-filter:blur(10px); }
    .screen.hidden { display:none; }
    h1 { color:#d4af37; font-size:36px; margin-bottom:12px; text-shadow:0 0 25px rgba(212,175,55,0.4); }
    p { color:#a1a1a6; margin-bottom:28px; max-width:320px; line-height:1.7; }
    button { background:linear-gradient(135deg,#fcf6ba,#b38728); color:#0b0b0d; border:none; padding:16px 40px; font-size:18px; font-weight:900; border-radius:50px; cursor:pointer; box-shadow:0 0 25px rgba(212,175,55,0.4); }
</style>
<script src="../js/jamam-core.js"></script>
<script src="../js/jamam-progress.js"></script>
<script src="../js/jamam-achievements.js"></script>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="hud">
        <div class="box"><small>SCORE</small><b id="score">0</b></div>
        <div class="box"><small>ENERGY</small><b id="energy">100%</b></div>
    </div>
    <div class="hint">Drag to move • Tap to ping • Reach the green exit</div>

    <div id="start-screen" class="screen">
        <h1 id="t-title">Echo Sonar</h1>
        <p id="t-desc">You can't see. You explore with echo pulses.<br>Reveal the maze and reach the green exit.</p>
        <button id="t-btn" onclick="startGame()">Play</button>
    </div>
    <div id="over-screen" class="screen hidden">
        <h1 style="color:#ff287b">Game Over</h1>
        <p>Score: <span id="final-score">0</span></p>
        <button onclick="startGame()">Retry</button>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const I18N = {
    en: { title:"Echo Sonar", desc:"You can't see. You explore with echo pulses.<br>Reveal the maze and reach the green exit.", play:"Play" },
    ar: { title:"صدى الظلام", desc:"أنت لا ترى... تستكشف بالصدى.<br>اكشف المتاهة ووصل للمخرج الأخضر.", play:"ابدأ" }
};
const L = (window.JAMAM && JAMAM.lang && I18N[JAMAM.lang()]) ? JAMAM.lang() : 'en';
document.getElementById('t-title').innerText = I18N[L].title;
document.getElementById('t-desc').innerHTML = I18N[L].desc;
document.getElementById('t-btn').innerText = I18N[L].play;

let w, h;
function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

let player, goal, walls, waves, reveal, score, energy, isPlaying, isDragging, animId;

function startGame() {
    player = { x: 30, y: h/2 };
    goal = { x: w - 30, y: h/2, r: 15 };
    walls = [
        { x: w*0.2, y: 0, w: 12, h: h*0.35 },
        { x: w*0.2, y: h*0.55, w: 12, h: h*0.45 },
        { x: w*0.45, y: h*0.2, w: 12, h: h*0.8 },
        { x: w*0.65, y: 0, w: 12, h: h*0.4 },
        { x: w*0.65, y: h*0.6, w: 12, h: h*0.4 },
        { x: w*0.85, y: h*0.35, w: 12, h: h*0.35 }
    ];
    waves = []; reveal = walls.map(() => 0);
    score = 0; energy = 100;
    isPlaying = true; isDragging = false;
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('over-screen').classList.add('hidden');
    if(window.JAMAM && JAMAM.game) JAMAM.game.start('echo-sonar');
    animId = requestAnimationFrame(loop);
}

function ping() {
    if (!isPlaying || energy < 15) return;
    energy -= 15;
    waves.push({ x: player.x, y: player.y, r: 5, life: 1.5 });
    reveal = reveal.map(() => 1.5);
    document.getElementById('energy').innerText = Math.round(energy) + '%';
    if(window.JAMAM && JAMAM.haptics) JAMAM.haptics.tap('hit');
}

canvas.addEventListener('pointerdown', e => {
    if(!isPlaying) return;
    isDragging = true;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    if(Math.hypot(x - player.x, y - player.y) > 40) ping();
    else { player.x = x; player.y = y; }
});
canvas.addEventListener('pointermove', e => {
    if(!isDragging || !isPlaying) return;
    const rect = canvas.getBoundingClientRect();
    player.x = Math.max(10, Math.min(w - 10, e.clientX - rect.left));
    player.y = Math.max(10, Math.min(h - 10, e.clientY - rect.top));
});
canvas.addEventListener('pointerup', () => { isDragging = false; });

let lastTime = 0;
function loop(now) {
    if(!isPlaying) return;
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    animId = requestAnimationFrame(loop);

    ctx.fillStyle = '#02030a';
    ctx.fillRect(0, 0, w, h);

    // Waves
    waves.forEach(wv => {
        wv.r += 400 * dt; wv.life -= dt;
        ctx.strokeStyle = `rgba(212,175,55,${Math.max(0, wv.life/1.5)*0.7})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(wv.x, wv.y, wv.r, 0, Math.PI*2); ctx.stroke();
    });
    waves = waves.filter(wv => wv.life > 0);

    // Reveal timer
    reveal = reveal.map(v => Math.max(0, v - dt));

    // Walls
    walls.forEach((wll, i) => {
        if(reveal[i] > 0) {
            ctx.globalAlpha = Math.min(1, reveal[i]);
            ctx.shadowBlur = 12; ctx.shadowColor = '#d4af37';
            ctx.fillStyle = '#d4af37';
            ctx.fillRect(wll.x, wll.y, wll.w, wll.h);
            ctx.shadowBlur = 0; ctx.globalAlpha = 1;
        }
    });

    // Goal
    ctx.fillStyle = '#3cff8c'; ctx.shadowBlur = 20; ctx.shadowColor = '#3cff8c';
    ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // Player
    ctx.fillStyle = '#ff287b'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff287b';
    ctx.beginPath(); ctx.arc(player.x, player.y, 8, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // Energy regen
    energy = Math.min(100, energy + 3 * dt);
    document.getElementById('energy').innerText = Math.round(energy) + '%';

    // Collision with revealed walls
    walls.forEach((wll, i) => {
        if(reveal[i] > 0 && player.x + 8 > wll.x && player.x - 8 < wll.x + wll.w &&
           player.y + 8 > wll.y && player.y - 8 < wll.y + wll.h) {
            gameOver(); return;
        }
    });

    // Reach goal
    if(Math.hypot(player.x - goal.x, player.y - goal.y) < goal.r + 8) {
        score += 100;
        document.getElementById('score').innerText = score;
        // Next level: reset
        startGame();
    }
}

function gameOver() {
    isPlaying = false;
    cancelAnimationFrame(animId);
    document.getElementById('final-score').innerText = score;
    document.getElementById('over-screen').classList.remove('hidden');
    if(window.JAMAM && JAMAM.game) JAMAM.game.end('echo-sonar', { score: score });
}
</script>
</body>
</html>
