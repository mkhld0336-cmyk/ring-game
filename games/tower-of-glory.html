<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tower of Glory | برج المجد</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
    body { overflow: hidden; background: #05050b; font-family: system-ui, -apple-system, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; pointer-events: none; }
    #score-display { font-size: 40px; font-weight: 900; text-shadow: 0 0 15px #00f3ff; color: #00f3ff; }
    #start-screen, #game-over { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5,5,11,0.9); backdrop-filter: blur(8px); z-index: 10; color: white; text-align: center; }
    .hidden { display: none !important; }
    h1 { font-size: 42px; color: #f7c969; text-shadow: 0 0 25px rgba(247,201,105,0.5); margin-bottom: 10px; }
    p { font-size: 16px; color: #a0a5c0; margin-bottom: 30px; max-width: 80%; line-height: 1.5; }
    button { background: linear-gradient(135deg, #00f3ff, #0077ff); color: #000; border: none; padding: 15px 40px; font-size: 20px; font-weight: 900; border-radius: 30px; cursor: pointer; box-shadow: 0 0 20px rgba(0,243,255,0.4); }
</style>
<script src="../js/jamam-core.js"></script>
<script src="../js/jamam-progress.js"></script>
<script src="../js/jamam-achievements.js"></script>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui"><div id="score-display">0</div></div>
    <div id="start-screen">
        <h1 id="txt-title">Tower of Glory</h1>
        <p id="txt-desc">Tap the screen to drop the block.<br>Build the highest tower to get a massive crowd!</p>
        <button id="btn-start" onclick="startGame()">Play</button>
    </div>
    <div id="game-over" class="hidden">
        <h1 id="txt-go" style="color:#ff287b; text-shadow: 0 0 25px rgba(255,40,123,0.5);">Game Over</h1>
        <p style="font-size:24px; color:white; margin-bottom:20px;">Score: <span id="final-score">0</span></p>
        <button onclick="startGame()">Retry</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const I18N = {
            en: { title: "Tower of Glory", desc: "Tap the screen to drop the block.<br>Build the highest tower to get a massive crowd!", play: "Play", over: "Game Over" },
            ar: { title: "برج المجد", desc: "انقر على الشاشة لإسقاط المكعب.<br>ابنِ أعلى برج لتجمع الجماهير!", play: "ابدأ", over: "انتهت اللعبة" }
        };
        const T = I18N[(window.JAMAM && JAMAM.lang && I18N[JAMAM.lang()]) ? JAMAM.lang() : 'en'];
        document.getElementById('txt-title').innerHTML = T.title;
        document.getElementById('txt-desc').innerHTML = T.desc;
        document.getElementById('btn-start').innerText = T.play;
        document.getElementById('txt-go').innerText = T.over;

        let w, h;
        function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        let blocks = [];
        let currentBlock = null;
        let score = 0;
        let isPlaying = false;
        let animationId;
        let crowd = [];
        let baseSpeed = 3;
        let speed = 3;

        const blockHeight = 30;
        const startWidth = 120;

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');
            blocks = [];
            crowd = [];
            score = 0;
            speed = baseSpeed;
            
            // Base block
            blocks.push({ x: w/2 - startWidth/2, y: h - 100, width: startWidth, height: blockHeight, color: '#f7c969' });
            spawnBlock();
            
            isPlaying = true;
            document.getElementById('score-display').innerText = "0";
            if(window.JAMAM && JAMAM.game) JAMAM.game.start('tower-of-glory');
            animationId = requestAnimationFrame(gameLoop);
        }

        function spawnBlock() {
            let lastBlock = blocks[blocks.length - 1];
            currentBlock = {
                x: 0,
                y: lastBlock.y - blockHeight,
                width: lastBlock.width,
                height: blockHeight,
                color: '#00f3ff',
                dir: 1
            };
            speed = baseSpeed + (score * 0.1); // Speed up as tower grows
        }

        // Drop block on tap
        canvas.addEventListener('pointerdown', () => {
            if(!isPlaying || !currentBlock) return;
            
            let lastBlock = blocks[blocks.length - 1];
            
            // Calculate overlap
            let overlapLeft = Math.max(currentBlock.x, lastBlock.x);
            let overlapRight = Math.min(currentBlock.x + currentBlock.width, lastBlock.x + lastBlock.width);
            let overlapWidth = overlapRight - overlapLeft;

            if(overlapWidth > 0) {
                // Success
                score++;
                document.getElementById('score-display').innerText = score;
                
                // Trim block to overlap
                currentBlock.x = overlapLeft;
                currentBlock.width = overlapWidth;
                blocks.push(currentBlock);
                
                if(window.JAMAM && JAMAM.haptics) JAMAM.haptics.tap('hit');
                
                // Add crowd
                if(score % 2 === 0) {
                    crowd.push({
                        x: Math.random() * w,
                        y: h - 150 + Math.random() * 100,
                        emoji: ['👏', '🔥', '👥', '💖', '🌟'][Math.floor(Math.random() * 5)],
                        size: 15 + Math.random() * 20,
                        alpha: 0.8
                    });
                }
                
                spawnBlock();
            } else {
                // Miss
                gameOver();
            }
        });

        function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            if(window.JAMAM && JAMAM.game) JAMAM.game.end('tower-of-glory', { score: score });
        }

        function draw() {
            ctx.fillStyle = '#05050b';
            ctx.fillRect(0, 0, w, h);

            // Draw background stars
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            for(let i=0; i<50; i++) {
                ctx.fillRect((i*97)%w, (i*89)%h, 2, 2);
            }

            // Draw Crowd
            crowd.forEach(c => {
                ctx.globalAlpha = c.alpha;
                ctx.font = `${c.size}px sans-serif`;
                ctx.fillText(c.emoji, c.x, c.y);
                ctx.globalAlpha = 1;
            });

            // Draw Blocks
            blocks.forEach((b, i) => {
                // Camera follow (move down as tower grows)
                let offsetY = Math.max(0, (blocks.length * blockHeight) - (h/2) + 100);
                let drawY = b.y + offsetY;
                
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = b.color;
                ctx.fillRect(b.x, drawY, b.width, b.height);
                ctx.shadowBlur = 0;
            });

            // Draw Current Block
            if(currentBlock && isPlaying) {
                let offsetY = Math.max(0, (blocks.length * blockHeight) - (h/2) + 100);
                ctx.fillStyle = currentBlock.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = currentBlock.color;
                ctx.fillRect(currentBlock.x, currentBlock.y + offsetY, currentBlock.width, currentBlock.height);
                ctx.shadowBlur = 0;
            }
        }

        function gameLoop() {
            if(!isPlaying) return;
            animationId = requestAnimationFrame(gameLoop);

            // Move current block
            if(currentBlock) {
                currentBlock.x += speed * currentBlock.dir;
                if(currentBlock.x <= 0 || currentBlock.x + currentBlock.width >= w) {
                    currentBlock.dir *= -1;
                }
            }

            draw();
        }
    </script>
</body>
</html>
