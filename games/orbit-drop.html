<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Orbit Drop - JAMAM Games</title>
  <script src="../js/jamam-core.js"></script>
  <script src="../js/jamam-progress.js"></script>
  <script src="../js/jamam-achievements.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #05050f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #fff; }
    #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5, 5, 15, 0.88); backdrop-filter: blur(8px); transition: opacity 0.3s ease; padding: 24px; text-align: center; }
    .hidden { opacity: 0; pointer-events: none; }
    h1 { font-size: 2.5rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p.desc { font-size: 0.95rem; color: #a0a5c0; margin-bottom: 24px; max-width: 320px; line-height: 1.4; }
    .btn { background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%); color: #05050f; border: none; padding: 16px 40px; font-size: 1.1rem; font-weight: 700; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px rgba(120, 255, 214, 0.3); transform: translateY(0); transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 1px; }
    .btn:active { transform: scale(0.96); box-shadow: 0 0 10px rgba(120, 255, 214, 0.3); }
    .stats-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 20px; width: 100%; max-width: 280px; margin-bottom: 24px; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem; color: #a0a5c0; }
    .stat-val { font-weight: 700; color: #fff; }
    .score-big { font-size: 2.2rem; font-weight: 900; color: #78ffd6; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="start-overlay" class="overlay">
      <h1>Orbit Drop</h1>
      <p class="desc">Hold anywhere to pull inward, release to drift outward and avoid debris!</p>
      <button id="btn-start" class="btn">Play</button>
    </div>
    <div id="gameover-overlay" class="overlay hidden">
      <h1>Game Over</h1>
      <div id="final-score" class="score-big">0</div>
      <div class="stats-card">
        <div class="stat-row"><span>Survival Time</span><span id="val-time" class="stat-val">0s</span></div>
        <div class="stat-row"><span>Crystals</span><span id="val-crystals" class="stat-val">0</span></div>
      </div>
      <button id="btn-restart" class="btn">Play Again</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
    let audioCtx = null, gameState = 'START', score = 0, survivalSeconds = 0, crystalsCollected = 0, gameStartTime = 0;
    let cx = 0, cy = 0, coreRadius = 40, satelliteAngle = 0, satelliteRadius = 110, targetRadius = 110, isHolding = false;
    let obstacles = [], crystals = [], particles = [], spawnTimer = 0;
    
    function resize() { const dpr = window.devicePixelRatio || 1; canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr; ctx.scale(dpr, dpr); cx = window.innerWidth / 2; cy = window.innerHeight / 2; }
    window.addEventListener('resize', resize); resize();
    function playSound(type) { try { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = type === 'crash' ? 'sawtooth' : 'sine'; o.frequency.setValueAtTime(type === 'crash' ? 150 : 587.33, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(type === 'crash' ? 30 : 1174.66, audioCtx.currentTime + 0.2); g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.2); } catch(e) {} }
    
    function startGame() { if (window.JAMAM && JAMAM.game) JAMAM.game.start('orbit-drop'); gameState = 'PLAYING'; score = 0; crystalsCollected = 0; gameStartTime = Date.now(); satelliteAngle = 0; satelliteRadius = 110; targetRadius = 110; obstacles = []; crystals = []; particles = []; spawnTimer = 0; document.getElementById('start-overlay').classList.add('hidden'); document.getElementById('gameover-overlay').classList.add('hidden'); }
    function gameOver() { gameState = 'GAMEOVER'; survivalSeconds = Math.floor((Date.now() - gameStartTime) / 1000); const finalScore = survivalSeconds * 10 + crystalsCollected * 50; document.getElementById('final-score').innerText = finalScore; document.getElementById('val-time').innerText = `${survivalSeconds}s`; document.getElementById('val-crystals').innerText = crystalsCollected; document.getElementById('gameover-overlay').classList.remove('hidden'); if (window.JAMAM && JAMAM.game) JAMAM.game.end('orbit-drop', { score: finalScore, extra: { survivalSeconds, crystalsCollected } }); }
    
    window.addEventListener('pointerdown', (e) => { if (e.target.tagName === 'BUTTON') return; isHolding = true; });
    window.addEventListener('pointerup', () => { isHolding = false; });
    document.getElementById('btn-start').addEventListener('click', startGame); document.getElementById('btn-restart').addEventListener('click', startGame);
    
    function spawnEntity() { const angle = Math.random() * Math.PI * 2, dist = Math.min(window.innerWidth, window.innerHeight) * 0.55; if (Math.random() < 0.35) crystals.push({ angle, dist, speed: 0.015, size: 8 }); else obstacles.push({ angle, dist, speed: (Math.random() * 0.01 + 0.015) * (Math.random() < 0.5 ? 1 : -1), size: 14, color: Math.random() < 0.5 ? '#ff3366' : '#ff9900' }); }
    function createExplosion(x, y, color) { for (let i = 0; i < 20; i++) { const a = Math.random() * Math.PI * 2, s = Math.random() * 5 + 1; particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, size: Math.random()*3+2, color, alpha: 1 }); } }
    
    function update() {
      if (gameState === 'PLAYING') {
        spawnTimer++; if (spawnTimer >= Math.max(35, 75 - Math.floor((Date.now() - gameStartTime) / 4000))) { spawnEntity(); spawnTimer = 0; }
        satelliteAngle += 0.035; targetRadius = isHolding ? 75 : 145; satelliteRadius += (targetRadius - satelliteRadius) * 0.15;
        const satX = cx + Math.cos(satelliteAngle) * satelliteRadius, satY = cy + Math.sin(satelliteAngle) * satelliteRadius;
        for (let i = obstacles.length - 1; i >= 0; i--) { const o = obstacles[i]; o.dist -= 1.8; if (o.dist < coreRadius) { obstacles.splice(i, 1); continue; } const ox = cx + Math.cos(o.angle) * o.dist, oy = cy + Math.sin(o.angle) * o.dist; if (Math.hypot(satX - ox, satY - oy) < o.size + 10) { playSound('crash'); createExplosion(satX, satY, '#ff3366'); gameOver(); return; } }
        for (let i = crystals.length - 1; i >= 0; i--) { const c = crystals[i]; c.dist -= 1.5; if (c.dist < coreRadius) { crystals.splice(i, 1); continue; } const cxCoord = cx + Math.cos(c.angle) * c.dist, cyCoord = cy + Math.sin(c.angle) * c.dist; if (Math.hypot(satX - cxCoord, satY - cyCoord) < c.size + 12) { playSound('crystal'); crystalsCollected++; createExplosion(cxCoord, cyCoord, '#78ffd6'); crystals.splice(i, 1); } }
      }
      for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= 0.03; if (p.alpha <= 0) particles.splice(i, 1); }
    }
    function draw() {
      const w = window.innerWidth, h = window.innerHeight; ctx.clearRect(0, 0, w, h);
      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, w * 0.7); grad.addColorStop(0, '#0d1124'); grad.addColorStop(1, '#05050f'); ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
      ctx.save(); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(120, 255, 214, 0.15)'; ctx.beginPath(); ctx.arc(cx, cy, 75, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.arc(cx, cy, 145, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2); ctx.fillStyle = '#78ffd6'; ctx.shadowColor = '#78ffd6'; ctx.shadowBlur = 20; ctx.fill(); ctx.restore();
      const satX = cx + Math.cos(satelliteAngle) * satelliteRadius, satY = cy + Math.sin(satelliteAngle) * satelliteRadius; ctx.save(); ctx.beginPath(); ctx.arc(satX, satY, 10, 0, Math.PI * 2); ctx.fillStyle = '#a8ff78'; ctx.shadowColor = '#a8ff78'; ctx.shadowBlur = 15; ctx.fill(); ctx.restore();
      obstacles.forEach(o => { const ox = cx + Math.cos(o.angle) * o.dist, oy = cy + Math.sin(o.angle) * o.dist; ctx.save(); ctx.beginPath(); ctx.arc(ox, oy, o.size, 0, Math.PI * 2); ctx.fillStyle = o.color; ctx.shadowColor = o.color; ctx.shadowBlur = 10; ctx.fill(); ctx.restore(); });
      crystals.forEach(c => { const cxCoord = cx + Math.cos(c.angle) * c.dist, cyCoord = cy + Math.sin(c.angle) * c.dist; ctx.save(); ctx.beginPath(); ctx.arc(cxCoord, cyCoord, c.size, 0, Math.PI * 2); ctx.fillStyle = '#78ffd6'; ctx.shadowColor = '#78ffd6'; ctx.shadowBlur = 12; ctx.fill(); ctx.restore(); });
      particles.forEach(p => { ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.alpha); ctx.fill(); ctx.restore(); });
      if (gameState === 'PLAYING') { const currentSecs = Math.floor((Date.now() - gameStartTime) / 1000); ctx.save(); ctx.fillStyle = '#ffffff'; ctx.font = '700 24px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(currentSecs * 10 + crystalsCollected * 50, cx, 60); ctx.fillStyle = '#78ffd6'; ctx.font = '600 15px sans-serif'; ctx.fillText(`💎 ${crystalsCollected}`, cx, 88); ctx.restore(); }
    }
    function loop() { update(); draw(); requestAnimationFrame(loop); } requestAnimationFrame(loop);
  </script>
</body>
</html>
