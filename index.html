<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Exploding Ring V4</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: 'Arial', sans-serif;
    }
    canvas {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }
    #ui {
        position: absolute;
        top: 20px;
        width: 100%;
        text-align: center;
        color: white;
        pointer-events: none;
        z-index: 10;
    }
    h1 {
        font-size: 16px;
        margin: 0;
        text-shadow: 0 0 10px #fff;
    }
    h2 {
        font-size: 28px;
        color: #ffd700;
        margin-top: 5px;
        text-shadow: 0 0 15px #ffd700;
    }
    #event-text {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 40px;
        font-weight: bold;
        text-align: center;
        z-index: 30;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s, transform 0.5s;
    }
    #music-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 20;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid #fff;
        color: white;
        padding: 8px 12px;
        border-radius: 20px;
        cursor: pointer;
    }
</style>
</head>
<body>

<button id="music-btn">🎵 تشغيل الموسيقى</button>
<div id="event-text"></div>
<audio id="bg-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div id="ui">
    <h1>كل كرة تمر عبر نقطة ذهبية = كرة جديدة</h1>
    <h2 id="counter">الكرات: 1</h2>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 720;
canvas.height = 1280;

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

// إعدادات الشكل المتحول (دائرة / بيضاوي)
let radiusX = 280;
let radiusY = 280;
let targetRadiusX = 280;
let targetRadiusY = 280;
let isEllipse = false;

let balls = [];
let isFrozen = false;
let isGravity = false;
const MAX_BALLS = 800; 

const goldPoints = [
    { x: centerX, y: centerY - 120, r: 8 },
    { x: centerX, y: centerY + 120, r: 8 }
];

// نظام الأيام
const today = new Date().getDay();
let themeColor = "#55ccff"; 
let bgColor = "rgba(0, 8, 20, 0.15)"; 

switch(today) {
    case 0: themeColor = "#00ff88"; break; // الأحد
    case 1: themeColor = "#0099ff"; break; // الاثنين
    case 2: themeColor = "#bb55ff"; break; // الثلاثاء
    case 3: themeColor = "#ff4444"; break; // الأربعاء
    case 4: themeColor = "#ffd700"; break; // الخميس
    case 5: themeColor = "#00ffff"; break; // الجمعة
    case 6: themeColor = "#ff00ff"; break; // السبت
}

// الموسيقى
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88]; 
let noteIndex = 0;

function playNote() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.frequency.value = notes[noteIndex];
    noteIndex = (noteIndex + 1) % notes.length; 
    osc.type = "sine";
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

function randomColor() {
    return `hsl(${Math.random() * 360}, 100%, 60%)`;
}

class Ball {
    constructor(x, y, vx, vy, color) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.r = 4;
        this.color = color || randomColor();
        this.trail = [];
        this.hitGold = false; 
    }

    update() {
        if (isFrozen) return;

        // الخطوط الذكية: تقليل طول الخط كلما زادت الكرات
        let maxTrail = 800;
        if (balls.length > 30) maxTrail = 200;
        if (balls.length > 80) maxTrail = 50;
        if (balls.length > 150) maxTrail = 15;
        if (balls.length > 300) maxTrail = 5;

        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > maxTrail) this.trail.shift(); 

        // تأثير الجاذبية
        if (isGravity) {
            let gdx = centerX - this.x;
            let gdy = centerY - this.y;
            this.vx += gdx * 0.002;
            this.vy += gdy * 0.002;
        }

        this.x += this.vx;
        this.y += this.vy;

        // معادلة الارتداد داخل الشكل البيضاوي أو الدائرة
        let dx = this.x - centerX;
        let dy = this.y - centerY;
        
        // حساب المسافة بالنسبة للشكل الحالي
        let normX = dx / radiusX;
        let normY = dy / radiusY;
        let dist = Math.sqrt(normX*normX + normY*normY);

        if (dist + (this.r/radiusX) >= 1) {
            // ارتداد فيزيائي دقيق للبيضاوي
            let nx = dx / (radiusX * radiusX);
            let ny = dy / (radiusY * radiusY);
            let len = Math.sqrt(nx*nx + ny*ny);
            nx /= len; ny /= len;

            let dot = this.vx * nx + this.vy * ny;
            this.vx -= 2 * dot * nx;
            this.vy -= 2 * dot * ny;

            // تصحيح الموقع لمنع الخروج
            this.x = centerX + (dx / dist) * radiusX * 0.98;
            this.y = centerY + (dy / dist) * radiusY * 0.98;
        }

        if (!this.hitGold && balls.length < MAX_BALLS) {
            goldPoints.forEach(gp => {
                let gdx = this.x - gp.x;
                let gdy = this.y - gp.y;
                let gdist = Math.sqrt(gdx * gdx + gdy * gdy);

                if (gdist < gp.r + this.r + 5) {
                    this.hitGold = true; 
                    spawnNewBall(this.x, this.y);
                    playNote();
                    gp.flash = 1.0; 
                }
            });
        }
    }

    draw(ctx) {
        if (this.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            ctx.strokeStyle = this.color;
            ctx.lineWidth = balls.length > 100 ? 0.8 : 1.5;
            ctx.globalAlpha = 0.4;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
    }
}

function spawnNewBall(x, y) {
    let angle = Math.random() * Math.PI * 2;
    let speed = 3 + Math.random() * 3;
    balls.push(new Ball(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed));
    document.getElementById("counter").innerText = "الكرات: " + balls.length;
}

spawnNewBall(centerX, centerY + 50);

function drawRing() {
    // تحويل سلس بين الدائرة والبيضاوي
    radiusX += (targetRadiusX - radiusX) * 0.05;
    radiusY += (targetRadiusY - radiusY) * 0.05;

    ctx.beginPath();
    ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);
    
    // تأثير قوس قزح ليوم السبت
    if (today === 6) {
        let time = Date.now() / 1000;
        ctx.strokeStyle = `hsl(${(time * 100) % 360}, 100%, 60%)`;
    } else {
        ctx.strokeStyle = themeColor;
    }
    
    ctx.lineWidth = 5;
    ctx.shadowBlur = 15;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.stroke();
    ctx.shadowBlur = 0;
}

function drawGoldPoints() {
    goldPoints.forEach(gp => {
        ctx.beginPath();
        ctx.arc(gp.x, gp.y, gp.r, 0, Math.PI * 2);
        ctx.fillStyle = "#ffd700";
        
        if (gp.flash > 0) {
            ctx.shadowBlur = 30 * gp.flash;
            gp.flash -= 0.05;
        } else {
            ctx.shadowBlur = 15;
        }
        ctx.shadowColor = "#ffd700";
        ctx.fill();
        ctx.shadowBlur = 0;
    });
}

// ----------------- الأحداث العشوائية -----------------
const eventText = document.getElementById("event-text");

// 1. حدث التحول للبيضاوي (كل 15 ثانية)
setInterval(() => {
    isEllipse = !isEllipse;
    if (isEllipse) {
        targetRadiusX = 320;
        targetRadiusY = 200;
    } else {
        targetRadiusX = 280;
        targetRadiusY = 280;
    }
}, 15000);

// 2. حدث التجميد (كل 25 ثانية)
setInterval(() => {
    if (isGravity) return; 
    isFrozen = true;
    eventText.innerText = "❄️ تجميد";
    eventText.style.color = "#00ffff";
    eventText.style.opacity = "1";
    eventText.style.transform = "translate(-50%, -50%) scale(1.2)";

    setTimeout(() => {
        isFrozen = false;
        eventText.style.opacity = "0";
        eventText.style.transform = "translate(-50%, -50%) scale(1)";
        balls.forEach(ball => {
            ball.vx *= 1.2;
            ball.vy *= 1.2;
        });
    }, 1500);
}, 25000);

// 3. حدث الجاذبية (كل 40 ثانية)
setInterval(() => {
    isGravity = true;
    eventText.innerText = "🌀 جاذبية";
    eventText.style.color = "#ff00ff";
    eventText.style.opacity = "1";
    
    setTimeout(() => {
        isGravity = false;
        eventText.style.opacity = "0";
        // إعطاء دفعة عشوائية بعد انتهاء الجاذبية
        balls.forEach(ball => {
            ball.vx += (Math.random() - 0.5) * 10;
            ball.vy += (Math.random() - 0.5) * 10;
        });
    }, 4000);
}, 40000);


function loop() {
    ctx.fillStyle = bgColor; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawRing();
    drawGoldPoints();

    for (let i = balls.length - 1; i >= 0; i--) {
        balls[i].update();
        balls[i].draw(ctx);
    }

    requestAnimationFrame(loop);
}

// الموسيقى
const musicBtn = document.getElementById("music-btn");
const bgMusic = document.getElementById("bg-music");

musicBtn.addEventListener("click", () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (bgMusic.paused) {
        bgMusic.play();
        musicBtn.innerText = "⏸️ إيقاف";
    } else {
        bgMusic.pause();
        musicBtn.innerText = "🎵 موسيقى";
    }
});

loop();
</script>

</body>
</html>
