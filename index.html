<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Exploding Ring - Shorts</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: 'Arial', sans-serif;
    }
    canvas {
        background-color: #000814;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }
    #ui {
        position: absolute;
        top: 20px;
        width: 100%;
        text-align: center;
        color: white;
        pointer-events: none;
        z-index: 10;
    }
    h1 {
        font-size: 18px;
        margin: 0;
        text-shadow: 0 0 10px #fff;
        letter-spacing: 1px;
        padding: 0 10px;
        line-height: 1.4;
    }
    h2 {
        font-size: 30px;
        color: #ffd700;
        margin-top: 5px;
        text-shadow: 0 0 15px #ffd700;
    }
    /* زر تشغيل الموسيقى */
    #music-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 20;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid #fff;
        color: white;
        padding: 10px 15px;
        border-radius: 20px;
        cursor: pointer;
        font-family: Arial;
    }
</style>
</head>
<body>

<!-- زر الموسيقى (يمكنك تغيير الرابط لاحقاً لموسيقى من اختيارك) -->
<button id="music-btn">🎵 تشغيل الموسيقى</button>
<audio id="bg-music" loop>
    <!-- ضع رابط ملف صوتي هنا -->
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div id="ui">
    <h1>كل كرة تمر عبر نقطة ذهبية = كرة جديدة واحدة</h1>
    <h2 id="counter">الكرات: 1</h2>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 720;
canvas.height = 1280;

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;
const ringRadius = 280;

let balls = [];
const MAX_BALLS = 500; 

const goldPoints = [
    { x: centerX, y: centerY - 120, r: 8 },
    { x: centerX, y: centerY + 120, r: 8 }
];

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playBeep(freq) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
}

function randomColor() {
    // جعل الألوان أكثر إشراقاً
    return `hsl(${Math.random() * 360}, 100%, 60%)`;
}

class Ball {
    constructor(x, y, vx, vy, color) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.r = 5;
        this.color = color || randomColor();
        this.trail = [];
        this.hitGold = false; 
    }

    update() {
        // الخط الذي لا ينتهي (نحتفظ بآخر 2000 نقطة كحد أقصى لتجنب تعليق الجوال)
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 2000) this.trail.shift(); 

        this.x += this.vx;
        this.y += this.vy;

        let dx = this.x - centerX;
        let dy = this.y - centerY;
        let dist = Math.sqrt(dx * dx + dy * dy);

        // إجبار الكرة على الارتداد داخل الدائرة الزرقاء
        if (dist + this.r >= ringRadius) {
            let nx = dx / dist;
            let ny = dy / dist;
            let dot = this.vx * nx + this.vy * ny;
            this.vx -= 2 * dot * nx;
            this.vy -= 2 * dot * ny;

            // تصحيح الموقع لضمان بقاء الكرة داخل الإطار
            this.x = centerX + nx * (ringRadius - this.r);
            this.y = centerY + ny * (ringRadius - this.r);
        }

        if (!this.hitGold && balls.length < MAX_BALLS) {
            goldPoints.forEach(gp => {
                let gdx = this.x - gp.x;
                let gdy = this.y - gp.y;
                let gdist = Math.sqrt(gdx * gdx + gdy * gdy);

                if (gdist < gp.r + this.r + 5) {
                    this.hitGold = true; 
                    spawnNewBall(this.x, this.y);
                    playBeep(400 + Math.random() * 400);
                    gp.flash = 1.0; 
                }
            });
        }
    }

    draw(ctx) {
        // رسم الخط الذي لا ينتهي
        if (this.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.3; // شفافية الخط
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        // رسم الكرة نفسها
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

function spawnNewBall(x, y) {
    let angle = Math.random() * Math.PI * 2;
    let speed = 3 + Math.random() * 3;
    balls.push(new Ball(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed));
    document.getElementById("counter").innerText = "الكرات: " + balls.length;
}

spawnNewBall(centerX, centerY + 50);

function drawRing() {
    ctx.beginPath();
    ctx.arc(centerX, centerY, ringRadius, 0, Math.PI * 2);
    ctx.strokeStyle = "#55ccff";
    ctx.lineWidth = 6;
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#55ccff";
    ctx.stroke();
    ctx.shadowBlur = 0;
}

function drawGoldPoints() {
    goldPoints.forEach(gp => {
        ctx.beginPath();
        ctx.arc(gp.x, gp.y, gp.r, 0, Math.PI * 2);
        ctx.fillStyle = "#ffd700";
        
        if (gp.flash > 0) {
            ctx.shadowBlur = 30 * gp.flash;
            ctx.shadowColor = "#ffd700";
            gp.flash -= 0.05;
        } else {
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ffd700";
        }
        
        ctx.fill();
        ctx.shadowBlur = 0;
    });
}

function loop() {
    // تقليل الشفافية لتترك مساحة للخطوط التي لا تنتهي
    ctx.fillStyle = "rgba(0, 8, 20, 0.1)"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawRing();
    drawGoldPoints();

    for (let i = balls.length - 1; i >= 0; i--) {
        balls[i].update();
        balls[i].draw(ctx);
    }

    requestAnimationFrame(loop);
}

// التحكم بالموسيقى
const musicBtn = document.getElementById("music-btn");
const bgMusic = document.getElementById("bg-music");

musicBtn.addEventListener("click", () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    if (bgMusic.paused) {
        bgMusic.play();
        musicBtn.innerText = "⏸️ إيقاف الموسيقى";
    } else {
        bgMusic.pause();
        musicBtn.innerText = "🎵 تشغيل الموسيقى";
    }
});

loop();
</script>

</body>
</html>
