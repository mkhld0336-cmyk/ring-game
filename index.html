<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>إقليم الجماجم والرموز | Realm of Skulls</title>
  <style>
    :root {
      --bg-dark: #080a10;
      --panel-bg: rgba(18, 22, 34, 0.85);
      --neon-cyan: #00f3ff;
      --neon-red: #ff0055;
      --neon-gold: #ffcc00;
      --neon-green: #00ff66;
      --text-main: #f0f4f8;
      --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Game Container - Vertical Mobile Aspect Ratio */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100vh;
      max-height: 900px;
      background: radial-gradient(circle at center, #121826 0%, #05070c 100%);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      border-left: 1px solid rgba(0, 243, 255, 0.1);
      border-right: 1px solid rgba(0, 243, 255, 0.1);
    }

    /* HUD Header */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: linear-gradient(180deg, rgba(5,7,12,0.9) 0%, rgba(5,7,12,0) 100%);
      pointer-events: none;
    }

    .hud-box {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }

    .hud-label {
      font-size: 0.75rem;
      color: #8a99ad;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--neon-cyan);
    }

    /* Target / Danger Area */
    #danger-line {
      position: absolute;
      bottom: 80px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-red), transparent);
      box-shadow: 0 0 10px var(--neon-red);
      opacity: 0.6;
    }

    /* Canvas Grid */
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Start / Overlay Screen */
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 12, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      z-index: 20;
      transition: opacity 0.3s ease;
    }

    .hidden {
      display: none !important;
    }

    .title {
      font-size: 2.2rem;
      font-weight: 900;
      background: linear-gradient(45deg, var(--neon-cyan), var(--neon-red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    }

    .subtitle {
      font-size: 0.95rem;
      color: #a0aec0;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .btn-main {
      background: linear-gradient(135deg, var(--neon-cyan), #0088ff);
      color: #000;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 16px 40px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
      transition: all 0.2s ease;
      width: 80%;
      max-width: 280px;
    }

    .btn-main:active {
      transform: scale(0.96);
    }

    /* Game Over Modal Styling */
    .modal-box {
      background: rgba(18, 22, 34, 0.95);
      border: 1px solid var(--neon-red);
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.3);
    }

    .go-title {
      color: var(--neon-red);
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .provoke-text {
      font-size: 0.9rem;
      color: var(--neon-gold);
      background: rgba(255, 204, 0, 0.1);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 10px;
    }

    .btn-retry {
      background: linear-gradient(135deg, var(--neon-red), #cc0044);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }

    .btn-secondary {
      background: transparent;
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      font-size: 0.9rem;
      font-weight: 700;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
    }

    /* Screen Shake Effect */
    .shake {
      animation: shakeAnim 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shakeAnim {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
      40%, 60% { transform: translate3d(8px, 0, 0); }
    }

    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--neon-red);
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.1s ease-out;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="flash-overlay"></div>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-box">
        <div class="hud-label">النقاط</div>
        <div class="hud-value" id="score-display">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">الزمن</div>
        <div class="hud-value" id="timer-display">00:00</div>
      </div>
    </div>

    <div id="danger-line"></div>
    <canvas id="gameCanvas"></canvas>

    <!-- Start Overlay -->
    <div id="start-screen" class="overlay-screen">
      <div class="title">إقليم الجماجم</div>
      <div class="subtitle">
        انقر على الرموز الآمنة للتقدم.<br>
        <strong style="color: var(--neon-red);">القاعدة الذهبية: لمس الجمجمة = خسارة فورية!</strong><br>
        احذر الرموز المتنكرة!
      </div>
      <button class="btn-main" onclick="startGame()">ابدأ التحدي 💀</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay-screen hidden">
      <div class="modal-box">
        <div class="go-title">سقوط مباشر! 💀</div>
        <div class="provoke-text" id="provoke-msg">سقطت ضحية الخدعة! 95% من اللاعبين يفشلون هنا.</div>
        
        <div class="stats-grid">
          <div class="stat-card">
            <div class="hud-label">النتيجة</div>
            <div class="hud-value" id="go-score">0</div>
          </div>
          <div class="stat-card">
            <div class="hud-label">الترتيب عالمياً</div>
            <div class="hud-value" style="color: var(--neon-gold);" id="go-rank">Top 99%</div>
          </div>
        </div>

        <button class="btn-retry" onclick="startGame()">محاولة جديدة ⚡</button>
        <button class="btn-secondary" onclick="shareChallenge()">نسخ رابط التحدي 🔗</button>
      </div>
    </div>
  </div>

  <script>
    // --- Audio Synth Setup (No External Assets) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
    }

    function playSound(freq, type, duration) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playExplosion() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    // --- Game Logic ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    let score = 0;
    let gameActive = false;
    let startTime = 0;
    let timerInterval = null;
    let items = [];
    let spawnRate = 900; // ms
    let lastSpawn = 0;

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class GameItem {
      constructor() {
        this.size = 45;
        this.x = Math.random() * (canvas.width - this.size * 2) + this.size;
        this.y = -this.size;
        this.speed = 2.5 + Math.random() * 2 + (score * 0.1);
        
        // 30% Skull, 70% Safe Symbol
        this.isSkull = Math.random() < 0.3;
        
        // Shapeshifter Trick Mechanic
        this.isShapeshifter = !this.isSkull && Math.random() < 0.25; 
        this.morphed = false;
        
        this.symbols = ['💎', '⚡', '🌙', '🌀', '🔮'];
        this.symbol = this.symbols[Math.floor(Math.random() * this.symbols.length)];
      }

      update() {
        this.y += this.speed;

        // Trigger Morph Trick close to bottom
        if (this.isShapeshifter && !this.morphed && this.y > canvas.height * 0.5) {
          this.morphed = true;
          this.isSkull = true;
          playSound(600, 'sawtooth', 0.1);
        }
      }

      draw() {
        ctx.save();
        ctx.font = `${this.size}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        if (this.isSkull) {
          ctx.shadowColor = '#ff0055';
          ctx.shadowBlur = 15;
          ctx.fillText('💀', this.x, this.y);
        } else {
          ctx.shadowColor = '#00f3ff';
          ctx.shadowBlur = 10;
          ctx.fillText(this.symbol, this.x, this.y);
        }
        ctx.restore();
      }
    }

    function startGame() {
      initAudio();
      score = 0;
      items = [];
      gameActive = true;
      document.getElementById('score-display').innerText = '0';
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('gameover-screen').classList.add('hidden');

      startTime = Date.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 1000);

      requestAnimationFrame(gameLoop);
    }

    function updateTimer() {
      if (!gameActive) return;
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      document.getElementById('timer-display').innerText = `${mins}:${secs}`;
    }

    function triggerGameOver() {
      gameActive = false;
      clearInterval(timerInterval);
      playExplosion();

      // Visual Shake & Flash
      container.classList.add('shake');
      const flash = document.getElementById('flash-overlay');
      flash.style.opacity = '0.8';
      setTimeout(() => {
        flash.style.opacity = '0';
        container.classList.remove('shake');
      }, 300);

      document.getElementById('go-score').innerText = score;
      
      // Dynamic Provocation Text
      const provokes = [
        "سقطت في الفخ! الجماجم المتنكرة لا ترحم.",
        "خدعة بسيطة كفيلة بإعادة الصفر! حاول مجدداً.",
        "وصلت لسرعة عالية لكنك فقدت التركيز!"
      ];
      document.getElementById('provoke-msg').innerText = provokes[Math.floor(Math.random() * provokes.length)];
      
      // Percentile Calculation
      const percentile = Math.max(1, Math.min(99, 100 - score * 2));
      document.getElementById('go-rank').innerText = `Top ${percentile}%`;

      document.getElementById('gameover-screen').classList.remove('hidden');
    }

    function gameLoop(timestamp) {
      if (!gameActive) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Spawn Items
      if (timestamp - lastSpawn > spawnRate) {
        items.push(new GameItem());
        lastSpawn = timestamp;
        if (spawnRate > 400) spawnRate -= 5;
      }

      // Update & Draw Items
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.update();
        item.draw();

        // Remove item if out of screen
        if (item.y > canvas.height + 50) {
          items.splice(i, 1);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    // Touch / Click Interaction Handling
    canvas.addEventListener('pointerdown', (e) => {
      if (!gameActive) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        const dist = Math.hypot(item.x - clickX, item.y - clickY);

        if (dist < item.size * 0.9) {
          if (item.isSkull) {
            triggerGameOver();
          } else {
            // Success Tap
            score++;
            document.getElementById('score-display').innerText = score;
            playSound(400 + score * 10, 'sine', 0.08);
            items.splice(i, 1);
          }
          break;
        }
      }
    });

    function shareChallenge() {
      const text = `تحديت إقليم الجماجم وحققت ${score} نقطة! هل تستطيع تجاوز هذا الرقم؟ 💀`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
        alert('تم نسخ نص التحدي مع النتيجة! انشره في حسابك الآن 🚀');
      }
    }
  </script>
</body>
</html>
