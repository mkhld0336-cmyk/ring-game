<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Exploding Ring V3</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: 'Arial', sans-serif;
        transition: background-color 1s;
    }
    canvas {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }
    #ui {
        position: absolute;
        top: 20px;
        width: 100%;
        text-align: center;
        color: white;
        pointer-events: none;
        z-index: 10;
    }
    h1 {
        font-size: 16px;
        margin: 0;
        text-shadow: 0 0 10px #fff;
        padding: 0 10px;
    }
    h2 {
        font-size: 28px;
        color: #ffd700;
        margin-top: 5px;
        text-shadow: 0 0 15px #ffd700;
        transition: color 0.5s;
    }
    #music-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 20;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid #fff;
        color: white;
        padding: 8px 12px;
        border-radius: 20px;
        cursor: pointer;
        font-family: Arial;
        font-size: 12px;
    }
    /* مؤشر التجميد */
    #freeze-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #00ffff;
        font-size: 50px;
        font-weight: bold;
        text-shadow: 0 0 20px #00ffff;
        display: none;
        z-index: 30;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
    }
</style>
</head>
<body>

<button id="music-btn">🎵 تشغيل الموسيقى</button>
<div id="freeze-text">❄️</div>
<audio id="bg-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div id="ui">
    <h1>كل كرة تمر عبر نقطة ذهبية = كرة جديدة</h1>
    <h2 id="counter">الكرات: 1</h2>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 720;
canvas.height = 1280;

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;
const ringRadius = 280;

let balls = [];
let isFrozen = false;
const MAX_BALLS = 500; 

// النقاط الذهبية
const goldPoints = [
    { x: centerX, y: centerY - 120, r: 8 },
    { x: centerX, y: centerY + 120, r: 8 }
];

// إعدادات نظام الأيام
const today = new Date().getDay();
let ringColor = "#55ccff"; // الافتراضي
let bgColor = "rgba(0, 8, 20, 0.1)"; // لون مسح الشاشة

switch(today) {
    case 0: ringColor = "#00ff88"; bgColor = "rgba(0, 20, 10, 0.1)"; break; // الأحد
    case 1: ringColor = "#0099ff"; bgColor = "rgba(0, 10, 20, 0.1)"; break; // الاثنين
    case 2: ringColor = "#bb55ff"; bgColor = "rgba(15, 0, 20, 0.1)"; break; // الثلاثاء
    case 3: ringColor = "#ff4444"; bgColor = "rgba(20, 0, 0, 0.1)"; break; // الأربعاء
    case 4: ringColor = "#ffd700"; bgColor = "rgba(20, 15, 0, 0.1)"; break; // الخميس
    case 5: ringColor = "#00ffff"; bgColor = "rgba(0, 20, 20, 0.1)"; break; // الجمعة
    case 6: ringColor = "rainbow"; break; // السبت
}

// إعدادات الموسيقى والنغمات (دو، ري، مي، فا، صول، لا، سي)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88]; 
let noteIndex = 0;

function playNote() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    
    // العزف بنغمات متتالية (لحن)
    osc.frequency.value = notes[noteIndex];
    noteIndex = (noteIndex + 1) % notes.length; 

    osc.type = "triangle"; // نوع الصوت
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

function randomColor() {
    return `hsl(${Math.random() * 360}, 100%, 60%)`;
}

class Ball {
    constructor(x, y, vx, vy, color) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.r = 5;
        this.color = color || randomColor();
        this.trail = [];
        this.hitGold = false; 
    }

    update() {
        if (isFrozen) return; // إذا كان التجميد مفعلاً، لا تتحرك الكرة

        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 2000) this.trail.shift(); 

        this.x += this.vx;
        this.y += this.vy;

        let dx = this.x - centerX;
        let dy = this.y - centerY;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist + this.r >= ringRadius) {
            let nx = dx / dist;
            let ny = dy / dist;
            let dot = this.vx * nx + this.vy * ny;
            this.vx -= 2 * dot * nx;
            this.vy -= 2 * dot * ny;

            this.x = centerX + nx * (ringRadius - this.r);
            this.y = centerY + ny * (ringRadius - this.r);
        }

        if (!this.hitGold && balls.length < MAX_BALLS) {
            goldPoints.forEach(gp => {
                let gdx = this.x - gp.x;
                let gdy = this.y - gp.y;
                let gdist = Math.sqrt(gdx * gdx + gdy * gdy);

                if (gdist < gp.r + this.r + 5) {
                    this.hitGold = true; 
                    spawnNewBall(this.x, this.y);
                    playNote(); // تشغيل النغمة الموسيقية
                    gp.flash = 1.0; 
                }
            });
        }
    }

    draw(ctx) {
        if (this.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.3;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

function spawnNewBall(x, y) {
    let angle = Math.random() * Math.PI * 2;
    let speed = 3 + Math.random() * 3;
    balls.push(new Ball(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed));
    document.getElementById("counter").innerText = "الكرات: " + balls.length;
}

spawnNewBall(centerX, centerY + 50);

function drawRing() {
    ctx.beginPath();
    ctx.arc(centerX, centerY, ringRadius, 0, Math.PI * 2);
    
    // نظام ألوان قوس قزح ليوم السبت
    if (ringColor === "rainbow") {
        let time = Date.now() / 1000;
        ctx.strokeStyle = `hsl(${(time * 100) % 360}, 100%, 60%)`;
    } else {
        ctx.strokeStyle = ringColor;
    }
    
    ctx.lineWidth = 6;
    ctx.shadowBlur = 20;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.stroke();
    ctx.shadowBlur = 0;
}

function drawGoldPoints() {
    goldPoints.forEach(gp => {
        ctx.beginPath();
        ctx.arc(gp.x, gp.y, gp.r, 0, Math.PI * 2);
        ctx.fillStyle = "#ffd700";
        
        if (gp.flash > 0) {
            ctx.shadowBlur = 30 * gp.flash;
            ctx.shadowColor = "#ffd700";
            gp.flash -= 0.05;
        } else {
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ffd700";
        }
        
        ctx.fill();
        ctx.shadowBlur = 0;
    });
}

// مؤثر التجميد
const freezeText = document.getElementById("freeze-text");
setInterval(() => {
    isFrozen = true;
    freezeText.style.display = "block";
    freezeText.style.opacity = "1";

    setTimeout(() => {
        isFrozen = false;
        freezeText.style.opacity = "0";
        setTimeout(() => freezeText.style.display = "none", 300);
        
        // زيادة السرعة بعد التجميد
        balls.forEach(ball => {
            ball.vx *= 1.3;
            ball.vy *= 1.3;
        });
    }, 1200);
}, 20000); // كل 20 ثانية

function loop() {
    ctx.fillStyle = bgColor; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawRing();
    drawGoldPoints();

    for (let i = balls.length - 1; i >= 0; i--) {
        balls[i].update();
        balls[i].draw(ctx);
    }

    requestAnimationFrame(loop);
}

// التحكم بالموسيقى
const musicBtn = document.getElementById("music-btn");
const bgMusic = document.getElementById("bg-music");

musicBtn.addEventListener("click", () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    if (bgMusic.paused) {
        bgMusic.play();
        musicBtn.innerText = "⏸️ إيقاف الموسيقى";
    } else {
        bgMusic.pause();
        musicBtn.innerText = "🎵 تشغيل الموسيقى";
    }
});

loop();
</script>

</body>
</html>
