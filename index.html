<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>إقليم الجماجم والرموز</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #050505;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: 'Arial', sans-serif;
        touch-action: none; /* لمنع تكبير الشاشة عند اللمس */
    }
    canvas {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }
    #ui {
        position: absolute;
        top: 20px;
        width: 100%;
        text-align: center;
        color: white;
        pointer-events: none;
        z-index: 10;
    }
    h1 {
        font-size: 20px;
        margin: 0;
        color: #ff3333;
        text-shadow: 0 0 15px #ff3333;
    }
    h2 {
        font-size: 30px;
        color: #ffd700;
        margin-top: 10px;
        text-shadow: 0 0 15px #ffd700;
    }
    #game-over {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: white;
        display: none;
        z-index: 20;
    }
    #game-over h1 {
        font-size: 50px;
        color: red;
        text-shadow: 0 0 30px red;
        margin-bottom: 20px;
    }
    #restart-btn {
        background: #ff3333;
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 20px;
        border-radius: 30px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 0 20px #ff3333;
    }
</style>
</head>
<body>

<div id="ui">
    <h1>إقليم الجماجم والرموز</h1>
    <h2 id="score">النجوم: 0</h2>
</div>

<div id="game-over">
    <h1>💀 انتهت اللعبة 💀</h1>
    <button id="restart-btn">المحاولة مجدداً</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 720;
canvas.height = 1280;

// متغيرات اللعبة
let score = 0;
let isGameOver = false;
let targetX = canvas.width / 2;
let targetY = canvas.height / 2 + 200;

// اللاعب
const player = {
    x: canvas.width / 2,
    y: canvas.height / 2 + 200,
    r: 15,
    speed: 0.1 // سرعة اللحاق باللمس
};

// المصفوفات
let stars = [];
let skulls = [];

// إعدادات الصعوبة
let skullSpeed = 1.5;
let spawnRate = 1000; // كل ثانية
let lastSpawnTime = 0;

// النجمة الأولى
spawnStar();

// أحداث اللمس والماوس
function updateTarget(e) {
    if (isGameOver) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    let clientX = e.clientX || e.touches[0].clientX;
    let clientY = e.clientY || e.touches[0].clientY;

    targetX = (clientX - rect.left) * scaleX;
    targetY = (clientY - rect.top) * scaleY;
}

canvas.addEventListener("mousemove", updateTarget);
canvas.addEventListener("touchmove", (e) => {
    e.preventDefault(); // منع التمرير
    updateTarget(e);
}, { passive: false });
canvas.addEventListener("touchstart", updateTarget, { passive: false });


// إنشاء نجمة جديدة
function spawnStar() {
    let padding = 60;
    let x = Math.random() * (canvas.width - padding * 2) + padding;
    let y = Math.random() * (canvas.height - padding * 2) + padding;
    
    // تجنب وضع النجمة فوق اللاعب مباشرة
    if (Math.hypot(x - player.x, y - player.y) < 100) {
        return spawnStar(); 
    }
    stars = [{ x: x, y: y, r: 15 }];
}

// إنشاء جمجمة جديدة
function spawnSkull() {
    let padding = 40;
    let x, y;
    // محاولة إبعاد الجمجمة عن اللاعب قليلاً عند ظهورها
    do {
        x = Math.random() * (canvas.width - padding * 2) + padding;
        y = Math.random() * (canvas.height - padding * 2) + padding;
    } while (Math.hypot(x - player.x, y - player.y) < 200);

    let angle = Math.random() * Math.PI * 2;
    skulls.push({
        x: x,
        y: y,
        r: 20,
        vx: Math.cos(angle) * skullSpeed,
        vy: Math.sin(angle) * skullSpeed,
        angle: angle
    });
}

// إعادة اللعبة
document.getElementById("restart-btn").addEventListener("click", () => {
    score = 0;
    isGameOver = false;
    skulls = [];
    skullSpeed = 1.5;
    player.x = canvas.width / 2;
    player.y = canvas.height / 2 + 200;
    targetX = player.x;
    targetY = player.y;
    document.getElementById("score").innerText = "النجوم: 0";
    document.getElementById("game-over").style.display = "none";
    spawnStar();
    lastSpawnTime = Date.now();
});

function loop(timestamp) {
    if (isGameOver) {
        // تأثير الشاشة الحمراء عند الموت
        ctx.fillStyle = "rgba(255, 0, 0, 0.3)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        requestAnimationFrame(loop);
        return;
    }

    // خلفية سوداء مع أثر خفيف
    ctx.fillStyle = "rgba(5, 5, 5, 0.3)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // تحرك اللاعب بسلاسة نحو الهدف (اللمس)
    player.x += (targetX - player.x) * player.speed;
    player.y += (targetY - player.y) * player.speed;

    // رسم اللاعب
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fillStyle = "#00ffff";
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#00ffff";
    ctx.fill();
    ctx.shadowBlur = 0;

    // إدارة النجوم
    stars.forEach((star, index) => {
        ctx.font = "30px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("⭐", star.x, star.y);

        // اصطدام اللاعب بالنجمة
        if (Math.hypot(player.x - star.x, player.y - star.y) < player.r + star.r) {
            score++;
            document.getElementById("score").innerText = "النجوم: " + score;
            
            // زيادة الصعوبة
            if (score % 3 === 0) skullSpeed += 0.5;
            
            spawnStar();
            // إضافة جمجمة مع كل نجمة
            spawnSkull(); 
        }
    });

    // إدارة الجماجم
    let now = Date.now();
    if (now - lastSpawnTime > spawnRate) {
        spawnSkull();
        lastSpawnTime = now;
        // تسريع ظهور الجماجم تدريجياً
        if (spawnRate > 400) spawnRate -= 50; 
    }

    skulls.forEach((skull, index) => {
        // حركة الجمجمة
        skull.x += skull.vx;
        skull.y += skull.vy;

        // ارتداد الجمجمة عن حواف الشاشة
        if (skull.x < skull.r || skull.x > canvas.width - skull.r) skull.vx *= -1;
        if (skull.y < skull.r || skull.y > canvas.height - skull.r) skull.vy *= -1;

        // رسم الجمجمة
        ctx.font = "40px Arial";
        ctx.fillText("💀", skull.x, skull.y);

        // اصطدام اللاعب بالجمجمة (الخسارة)
        if (Math.hypot(player.x - skull.x, player.y - skull.y) < player.r + skull.r) {
            isGameOver = true;
            document.getElementById("game-over").style.display = "block";
            // صوت انفجار بسيط
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }
    });

    requestAnimationFrame(loop);
}

// إعداد الصوت
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// بدء اللعبة
lastSpawnTime = Date.now();
requestAnimationFrame(loop);
</script>

</body>
</html>
