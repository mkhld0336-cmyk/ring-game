<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>إقليم الجماجم - Realm of Skulls</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #050505;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: 'Arial', sans-serif;
        touch-action: none;
    }
    canvas {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        background: #000;
    }
    #ui {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        color: white;
        pointer-events: none;
        z-index: 10;
    }
    h1 { font-size: 22px; margin: 0; color: #ff3333; text-shadow: 0 0 15px #ff3333; }
    .timer-bar {
        width: 80%;
        height: 10px;
        background: #333;
        margin: 10px auto;
        border-radius: 5px;
        overflow: hidden;
    }
    #timer-fill {
        height: 100%;
        width: 100%;
        background: #00ffff;
        transition: width 0.1s linear;
    }
    #game-over {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: white;
        display: none;
        z-index: 20;
        width: 90%;
        background: rgba(0,0,0,0.8);
        padding: 30px;
        border-radius: 20px;
        border: 2px solid #ff3333;
        box-shadow: 0 0 30px #ff3333;
    }
    #game-over h2 { font-size: 28px; color: red; margin-bottom: 10px; }
    #game-over p { font-size: 18px; margin-bottom: 20px; color: #ccc; }
    #restart-btn {
        background: #ff3333;
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 20px;
        border-radius: 30px;
        cursor: pointer;
        font-weight: bold;
    }
</style>
</head>
<body>

<div id="ui">
    <h1>إقليم الجماجم 💀</h1>
    <div class="timer-bar"><div id="timer-fill"></div></div>
</div>

<div id="game-over">
    <h2>💀 انتهت اللعبة 💀</h2>
    <p id="game-over-text"></p>
    <button id="restart-btn">المحاولة مجدداً</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 720;
canvas.height = 1280;

const COLS = 4;
const colWidth = canvas.width / COLS;
const hitZoneY = canvas.height - 200; // خط النقر
const hitZoneHeight = 30;

let isPlaying = false;
let timeLeft = 30; // 30 ثانية
let lastTime = 0;
let speed = 400; // سرعة السقوط بالبكسل في الثانية
let spawnTimer = 0;
let score = 0;

let tiles = [];
let shakeTime = 0;
let flashTime = 0;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// أصوات اللعبة
function playExplosion() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
}

function playLaugh() {
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = "square";
    // ضحكة ساخرة (ترددات متقطعة)
    osc.frequency.setValueAtTime(400, audioCtx.currentTime + 0.5);
    osc.frequency.setValueAtTime(300, audioCtx.currentTime + 0.6);
    osc.frequency.setValueAtTime(400, audioCtx.currentTime + 0.7);
    osc.frequency.setValueAtTime(300, audioCtx.currentTime + 0.8);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + 0.5);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.0);
    osc.start(audioCtx.currentTime + 0.5);
    osc.stop(audioCtx.currentTime + 1.0);
}

// فئة المربع الساقط
class Tile {
    constructor(col, isSkull) {
        this.col = col;
        this.x = col * colWidth;
        this.y = -100;
        this.width = colWidth - 10;
        this.height = 80;
        this.isSkull = isSkull; 
        this.isFake = isSkull && Math.random() > 0.5; // 50% من الجماجم متنكرة
        this.revealed = false;
        this.color = this.isFake ? "#00ff88" : (isSkull ? "#ff3333" : "#00ffff"); // متنكر = أخضر، جمجمة = أحمر، آمن = أزرق
        this.speed = 0; // سيتم تعيينها في التحديث
    }

    update(dt) {
        // تسريع تدريجي
        this.speed = speed;
        this.y += this.speed * dt;

        // الخداع البصري: إذا كانت متنكرة، تتحول قبل خط النقر بـ 150 بكسل
        if (this.isFake && !this.revealed && this.y > hitZoneY - 150) {
            this.revealed = true;
            this.color = "#ff3333"; // تتحول للأحمر
            this.isSkull = true; // تصبح مميتة
        }
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color;
        
        // رسم المربع
        ctx.beginPath();
        ctx.roundRect(this.x + 5, this.y, this.width, this.height, 15);
        ctx.fill();
        ctx.shadowBlur = 0;

        // رسم الجمجمة إذا كانت كذلك
        if (this.isSkull) {
            ctx.font = "40px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("💀", this.x + colWidth/2, this.y + this.height/2);
        }
    }
}

// رسم الخلفية والأعمدة
function drawBackground() {
    ctx.fillStyle = "#050505";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // خطوط الأعمدة
    ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
    ctx.lineWidth = 2;
    for (let i = 1; i < COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * colWidth, 0);
        ctx.lineTo(i * colWidth, canvas.height);
        ctx.stroke();
    }

    // خط النقر (Hit Zone)
    ctx.fillStyle = "rgba(0, 255, 255, 0.2)";
    ctx.fillRect(0, hitZoneY, canvas.width, hitZoneHeight);
    ctx.strokeStyle = "#00ffff";
    ctx.strokeRect(0, hitZoneY, canvas.width, hitZoneHeight);
}

// إدارة اللمس
canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (!isPlaying) return;
    
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const touchX = (e.touches[0].clientX - rect.left) * scaleX;
    const touchY = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height);
    
    handleTap(touchX, touchY);
}, { passive: false });

canvas.addEventListener("mousedown", (e) => {
    if (!isPlaying) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const touchX = (e.clientX - rect.left) * scaleX;
    const touchY = (e.clientY - rect.top) * (canvas.height / rect.height);
    handleTap(touchX, touchY);
});

function handleTap(x, y) {
    // التحقق من العمود
    let col = Math.floor(x / colWidth);

    // البحث عن مربع في هذا العمود داخل منطقة النقر
    for (let i = tiles.length - 1; i >= 0; i--) {
        let tile = tiles[i];
        if (tile.col === col && tile.y + tile.height > hitZoneY && tile.y < hitZoneY + hitZoneHeight) {
            
            if (tile.isSkull) {
                // خسارة
                gameOver();
            } else {
                // نجاح
                score++;
                tiles.splice(i, 1); // إزالة المربع
                // تأثير بصري بسيط
                flashTime = 0.1;
                flashColor = "rgba(0, 255, 255, 0.3)"; // فلاش أزرق للنجاح
            }
            return;
        }
    }
}

function gameOver() {
    isPlaying = false;
    playExplosion();
    setTimeout(playLaugh, 400);
    
    // اهتزاز الجوال (Haptics)
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);

    // اهتزاز الشاشة والفلاش
    shakeTime = 0.5;
    flashTime = 0.5;
    flashColor = "rgba(255, 0, 0, 0.6)";

    // إظهار شاشة النهاية
    document.getElementById("game-over").style.display = "block";
    let survived = (30 - timeLeft).toFixed(1);
    document.getElementById("game-over-text").innerText = 
        `سقطت في الثانية ${survived}... \n 98% من الناس لا يستطيعون تجاوزك!`;
}

// إعادة اللعبة
document.getElementById("restart-btn").addEventListener("click", () => {
    isPlaying = true;
    timeLeft = 30;
    speed = 400;
    spawnTimer = 0;
    score = 0;
    tiles = [];
    shakeTime = 0;
    flashTime = 0;
    document.getElementById("game-over").style.display = "none";
    lastTime = performance.now();
    requestAnimationFrame(loop);
});

let flashColor = "rgba(255, 0, 0, 0)";

function loop(timestamp) {
    if (!isPlaying) return;

    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    // تقليل الوقت
    timeLeft -= dt;
    document.getElementById("timer-fill").style.width = `${(timeLeft / 30) * 100}%`;
    
    if (timeLeft <= 0) {
        // فوز!
        timeLeft = 0;
        isPlaying = false;
        document.getElementById("game-over").style.display = "block";
        document.getElementById("game-over-text").innerText = "أنت من الـ 2% الذين نجوا! 🏆";
        return;
    }

    // تصعيد الصعوبة
    if (timeLeft < 20 && timeLeft > 10) {
        speed = 700;
        spawnTimer += dt;
        if (spawnTimer > 0.5) { spawnTile(); spawnTimer = 0; }
    } else if (timeLeft <= 10) {
        speed = 1000;
        spawnTimer += dt;
        if (spawnTimer > 0.3) { spawnTile(); spawnTimer = 0; }
    } else {
        spawnTimer += dt;
        if (spawnTimer > 0.8) { spawnTile(); spawnTimer = 0; }
    }

    // حفظ السياق لاهتزاز الشاشة
    ctx.save();
    if (shakeTime > 0) {
        let shakeX = (Math.random() - 0.5) * 30 * shakeTime;
        let shakeY = (Math.random() - 0.5) * 30 * shakeTime;
        ctx.translate(shakeX, shakeY);
        shakeTime -= dt;
    }

    drawBackground();

    // رسم وتحديث المربعات
    for (let i = tiles.length - 1; i >= 0; i--) {
        let tile = tiles[i];
        tile.update(dt);
        tile.draw();

        // إذا خرج المربع من الشاشة دون النقر عليه (وانه ليس جمجمة متنكرة)
        if (tile.y > canvas.height) {
            tiles.splice(i, 1);
            // في بعض الألعاب، تفويت مربع آمن يخصم نقاط، لكننا هنا نركز على الجماجم
        }
    }

    ctx.restore();

    // فلاش الشاشة (Juice)
    if (flashTime > 0) {
        ctx.fillStyle = flashColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        flashTime -= dt;
    }

    requestAnimationFrame(loop);
}

function spawnTile() {
    let col = Math.floor(Math.random() * COLS);
    
    // التأكد من عدم وجود مربع في نفس العمود قريب جداً
    for (let t of tiles) {
        if (t.col === col && t.y < 200) return; 
    }

    // احتمالية ظهور جمجمة (تزيد مع الوقت)
    let isSkull = Math.random() < (timeLeft < 10 ? 0.5 : 0.3);
    tiles.push(new Tile(col, isSkull));
}

// البدء التلقائي عند أول لمسة
canvas.addEventListener("touchstart", () => {
    if (!isPlaying && timeLeft === 30 && document.getElementById("game-over").style.display === "none") {
        isPlaying = true;
        lastTime = performance.now();
        requestAnimationFrame(loop);
    }
}, { once: true });

// البدء بالماوس للتجربة
canvas.addEventListener("mousedown", () => {
    if (!isPlaying && timeLeft === 30 && document.getElementById("game-over").style.display === "none") {
        isPlaying = true;
        lastTime = performance.now();
        requestAnimationFrame(loop);
    }
}, { once: true });

// دعم المتصفحات القديمة لـ roundRect
if(!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.beginPath();
        this.moveTo(x+r, y);
        this.arcTo(x+w, y,   x+w, y+h, r);
        this.arcTo(x+w, y+h, x,   y+h, r);
        this.arcTo(x,   y+h, x,   y,   r);
        this.arcTo(x,   y,   x+w, y,   r);
        this.closePath();
        return this;
    }
}

</script>
</body>
</html>
