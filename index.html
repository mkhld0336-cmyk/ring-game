<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Morphing Universe V5</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: 'Arial', sans-serif;
        transition: background-color 2s;
    }
    canvas {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }
    #ui {
        position: absolute;
        top: 15px;
        width: 100%;
        text-align: center;
        color: white;
        pointer-events: none;
        z-index: 10;
    }
    h1 {
        font-size: 14px;
        margin: 0;
        text-shadow: 0 0 10px #fff;
    }
    h2 {
        font-size: 24px;
        color: #ffd700;
        margin-top: 5px;
        text-shadow: 0 0 15px #ffd700;
    }
    #evolutionText {
        position: absolute;
        top: 90px;
        width: 100%;
        text-align: center;
        font-size: 32px;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 0 20px cyan, 0 0 40px cyan;
        z-index: 15;
        pointer-events: none;
        letter-spacing: 2px;
        transition: color 0.5s;
    }
    #event-text {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 45px;
        font-weight: bold;
        text-align: center;
        z-index: 30;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s, transform 0.5s;
    }
    .controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 15px;
        z-index: 20;
    }
    .controls button {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid #fff;
        color: white;
        padding: 10px 20px;
        border-radius: 25px;
        cursor: pointer;
        font-family: 'Arial';
        font-weight: bold;
        backdrop-filter: blur(5px);
    }
    .controls button:active {
        background: rgba(255, 255, 255, 0.4);
    }
</style>
</head>
<body>

<div id="ui">
    <h1>كل كرة تمر عبر نقطة ذهبية = كرة جديدة</h1>
    <h2 id="counter">الكرات: 1</h2>
</div>
<div id="evolutionText">EVOLUTION ZERO</div>
<div id="event-text"></div>

<audio id="bg-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<canvas id="game"></canvas>

<div class="controls">
    <button id="btn-pause">⏸️ إيقاف</button>
    <button id="btn-reset">🔄 إعادة</button>
    <button id="btn-music">🎵 موسيقى</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 720;
canvas.height = 1280;

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;
let ringRadius = 280;

let balls = [];
let isFrozen = false;
let isGravity = false;
let isRunning = true;
let exploded200 = false;
const MAX_BALLS = 800; 

const goldPoints = [
    { x: centerX, y: centerY - 120, r: 8 },
    { x: centerX, y: centerY + 120, r: 8 }
];

// نظام الألوان
let baseHue = 180; // أزرق سماوي
let bgColor = "rgba(0, 8, 20, 0.15)"; 
document.body.style.background = "#000814";

// الموسيقى
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88]; 
let noteIndex = 0;

function playNote() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.frequency.value = notes[noteIndex];
    noteIndex = (noteIndex + 1) % notes.length; 
    osc.type = "sine";
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

function randomColor() {
    return `hsl(${Math.random() * 360}, 100%, 60%)`;
}

class Ball {
    constructor(x, y, vx, vy, color) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.r = 4;
        this.color = color || randomColor();
        this.trail = [];
        this.hitGold = false; 
    }

    update() {
        if (isFrozen || !isRunning) return;

        // الخطوط الذكية
        let maxTrail = 600;
        if (balls.length > 30) maxTrail = 150;
        if (balls.length > 80) maxTrail = 50;
        if (balls.length > 150) maxTrail = 15;
        if (balls.length > 300) maxTrail = 5;

        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > maxTrail) this.trail.shift(); 

        // الجاذبية
        if (isGravity) {
            let gdx = centerX - this.x;
            let gdy = centerY - this.y;
            this.vx += gdx * 0.003;
            this.vy += gdy * 0.003;
        }

        this.x += this.vx;
        this.y += this.vy;

        // حساب مسافة الارتداد (دائرة أو بيضاوي)
        let dx = this.x - centerX;
        let dy = this.y - centerY;
        
        // ارتداد داخل الشكل (نستخدم معادلة مرنة تناسب الأشكال)
        let dist = Math.sqrt(dx*dx + dy*dy);
        let currentRadius = ringRadius + Math.sin(Date.now() / 1000) * 20; // نبض خفيف

        if (dist + this.r >= currentRadius) {
            let nx = dx / dist;
            let ny = dy / dist;
            let dot = this.vx * nx + this.vy * ny;
            this.vx -= 2 * dot * nx;
            this.vy -= 2 * dot * ny;

            this.x = centerX + nx * (currentRadius - this.r);
            this.y = centerY + ny * (currentRadius - this.r);
        }

        if (!this.hitGold && balls.length < MAX_BALLS) {
            goldPoints.forEach(gp => {
                let gdx = this.x - gp.x;
                let gdy = this.y - gp.y;
                let gdist = Math.sqrt(gdx * gdx + gdy * gdy);

                if (gdist < gp.r + this.r + 5) {
                    this.hitGold = true; 
                    spawnNewBall(this.x, this.y);
                    playNote();
                    gp.flash = 1.0; 
                }
            });
        }
    }

    draw(ctx) {
        if (this.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            ctx.strokeStyle = this.color;
            ctx.lineWidth = balls.length > 100 ? 0.5 : 1.5;
            ctx.globalAlpha = 0.4;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
    }
}

function spawnNewBall(x, y) {
    if (balls.length >= MAX_BALLS) return;
    let angle = Math.random() * Math.PI * 2;
    let speed = 3 + Math.random() * 3;
    balls.push(new Ball(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed));
    document.getElementById("counter").innerText = "الكرات: " + balls.length;
}

// نظام رسم الشكل المتحول (Morphing)
function drawMorphShape() {
    let progress = 0;
    if (balls.length > 50) progress = Math.min((balls.length - 50) / 100, 1); // 0 to 1

    // تحول الشكل من دائرة إلى بيضاوي
    let radiusX = ringRadius + (ringRadius * 0.3 * progress);
    let radiusY = ringRadius - (ringRadius * 0.2 * progress);

    // ألوان النيون المتحركة
    let hue = (Date.now() * 0.03) % 360;
    if (balls.length > 150) hue = (hue + 180) % 360; // تغيير اللون في مرحلة الفوضى

    ctx.beginPath();
    
    // إذا وصلنا لمرحلة متقدمة، نرسم شكل نجمة (باستخدام مثلثات)
    if (balls.length > 300) {
        let spikes = 5;
        for (let i = 0; i < spikes * 2; i++) {
            let rot = (Math.PI / spikes) * i;
            let r = (i % 2 === 0) ? radiusX : radiusX * 0.5;
            let x = centerX + Math.cos(rot) * r;
            let y = centerY + Math.sin(rot) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
    } else {
        // دائرة أو بيضاوي
        ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);
    }

    ctx.lineWidth = 6;
    ctx.strokeStyle = `hsl(${hue}, 100%, 60%)`;
    ctx.shadowBlur = 30;
    ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
    ctx.stroke();
    ctx.shadowBlur = 0;
}

function drawGoldPoints() {
    goldPoints.forEach(gp => {
        ctx.beginPath();
        ctx.arc(gp.x, gp.y, gp.r, 0, Math.PI * 2);
        ctx.fillStyle = "#ffd700";
        
        if (gp.flash > 0) {
            ctx.shadowBlur = 30 * gp.flash;
            gp.flash -= 0.05;
        } else {
            ctx.shadowBlur = 15;
        }
        ctx.shadowColor = "#ffd700";
        ctx.fill();
        ctx.shadowBlur = 0;
    });
}

// ----------------- الأحداث الأسطورية -----------------
const eventText = document.getElementById("event-text");
const evolutionText = document.getElementById("evolutionText");

function updateEvolution() {
    let count = balls.length;
    
    // تغيير الخلفية
    if (count > 100 && count < 300) document.body.style.background = "#120022";
    if (count >= 300 && count < 600) document.body.style.background = "#001a33";
    if (count >= 600) document.body.style.background = "#220000";

    // تغيير النص
    let text = "EVOLUTION ZERO";
    let color = "white";
    if (count > 50) { text = "ELLIPSE AGE"; color = "#00ffff"; }
    if (count > 150) { text = "CHAOS AGE"; color = "#ff00ff"; }
    if (count > 300) { text = "UNIVERSE AGE"; color = "#ff4444"; }
    if (count > 600) { text = "SINGULARITY"; color = "#ffd700"; }
    
    evolutionText.innerText = text;
    evolutionText.style.color = color;
    evolutionText.style.textShadow = `0 0 20px ${color}`;

    // الانفجار الكوني عند 200 كرة
    if (count >= 200 && !exploded200) {
        exploded200 = true;
        explodeUniverse();
    }
}

function explodeUniverse() {
    eventText.innerText = "💥 COSMIC EXPLOSION 💥";
    eventText.style.color = "#ff0000";
    eventText.style.opacity = "1";
    eventText.style.transform = "translate(-50%, -50%) scale(1.5)";
    
    setTimeout(() => {
        eventText.style.opacity = "0";
        eventText.style.transform = "translate(-50%, -50%) scale(1)";
    }, 2000);

    for (let i = 0; i < 100; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = 8 + Math.random() * 10;
        spawnNewBall(centerX, centerY);
        let b = balls[balls.length - 1];
        b.vx = Math.cos(angle) * speed;
        b.vy = Math.sin(angle) * speed;
    }
}

// أحداث التجميد والجاذبية
setInterval(() => {
    if (!isRunning || isGravity) return; 
    isFrozen = true;
    eventText.innerText = "❄️ تجميد";
    eventText.style.color = "#00ffff";
    eventText.style.opacity = "1";
    eventText.style.transform = "translate(-50%, -50%) scale(1.2)";

    setTimeout(() => {
        isFrozen = false;
        eventText.style.opacity = "0";
        eventText.style.transform = "translate(-50%, -50%) scale(1)";
        balls.forEach(ball => {
            ball.vx *= 1.2; ball.vy *= 1.2;
        });
    }, 1500);
}, 25000);

setInterval(() => {
    if (!isRunning) return;
    isGravity = true;
    eventText.innerText = "🌀 جاذبية";
    eventText.style.color = "#ff00ff";
    eventText.style.opacity = "1";
    
    setTimeout(() => {
        isGravity = false;
        eventText.style.opacity = "0";
        balls.forEach(ball => {
            ball.vx += (Math.random() - 0.5) * 10;
            ball.vy += (Math.random() - 0.5) * 10;
        });
    }, 4000);
}, 40000);

// ----------------- حلقة اللعبة والتحكم -----------------
function loop() {
    if (isRunning) {
        ctx.fillStyle = bgColor; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawMorphShape();
        drawGoldPoints();
        updateEvolution();

        for (let i = balls.length - 1; i >= 0; i--) {
            balls[i].update();
            balls[i].draw(ctx);
        }
    }
    requestAnimationFrame(loop);
}

// الأزرار
document.getElementById("btn-pause").addEventListener("click", function() {
    isRunning = !isRunning;
    this.innerText = isRunning ? "⏸️ إيقاف" : "▶️ تشغيل";
});

document.getElementById("btn-reset").addEventListener("click", function() {
    balls = [];
    exploded200 = false;
    document.body.style.background = "#000814";
    spawnNewBall(centerX, centerY);
    document.getElementById("counter").innerText = "الكرات: 1";
});

const bgMusic = document.getElementById("bg-music");
document.getElementById("btn-music").addEventListener("click", function() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (bgMusic.paused) {
        bgMusic.play();
        this.innerText = "⏸️ إيقاف موسيقى";
    } else {
        bgMusic.pause();
        this.innerText = "🎵 موسيقى";
    }
});

// البدء
spawnNewBall(centerX, centerY + 50);
loop();
</script>

</body>
</html>
